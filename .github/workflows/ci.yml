name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vaelmour
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vaelmour_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vaelmour -d vaelmour_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vaelmour:ci-only-password@127.0.0.1:5432/vaelmour_ci
      NODE_ENV: test
      DEV_AUTH_SECRET: ci-only-dev-auth-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
      - run: npm run db:deploy
      - run: npm run test:db
      - run: npm run simulate:balance:smoke
      - run: npm run simulate:economy
