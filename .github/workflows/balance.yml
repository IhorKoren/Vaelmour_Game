name: Full balance simulation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run simulate:balance
      - uses: actions/upload-artifact@v4
        with:
          name: phase8-balance-report
          path: reports/phase8-2-balance-report.md
