services:
  - type: web
    name: vaelmour-api-ihorkoren-2026
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/IhorKoren/Vaelmour_Game
    branch: main
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    dockerCommand: sh -c "npm run db:deploy && npm run start:server"
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: vaelmour-postgres-ihorkoren-2026
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://vaelmour.netlify.app
      - key: ALLOWED_ORIGINS
        value: https://vaelmour.netlify.app
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: ADMIN_MODE
        value: "false"
      - key: SESSION_TTL_SECONDS
        value: "86400"
      - key: TELEGRAM_AUTH_MAX_AGE_SECONDS
        value: "3600"

databases:
  - name: vaelmour-postgres-ihorkoren-2026
    plan: free
    region: frankfurt
    databaseName: vaelmour
    user: vaelmour
    postgresMajorVersion: "18"
